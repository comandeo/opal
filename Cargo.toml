[package]
name = "opal"
version = "0.1.0"
edition = "2024"
description = "Минималистичный Markdown-редактор"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[test]]
name = "gtk_editor"
harness = false

[[test]]
name = "gtk_window"
harness = false
